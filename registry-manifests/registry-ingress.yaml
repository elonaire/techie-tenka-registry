apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt  # ← Key: references the resolver name above
    # Optional: for HTTP → HTTPS redirect
    traefik.ingress.kubernetes.io/router.middlewares: redirect-https@kubernetescrd  # if you create a redirect middleware
spec:
  rules:
    - host: registry.techietenka.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  number: 5000
  tls:  # Keep this section, but remove secretName (or leave empty)
    - hosts:
        - registry.techietenka.com
      # secretName: registry-tls  # ← Comment out or delete this line
