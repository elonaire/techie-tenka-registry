name: Deploy Techie Tenka Docker Registry Manifests to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
          - uses: actions/checkout@v4

          - name: Setup SSH agent
            uses: webfactory/ssh-agent@v0.9.0
            with:
              ssh-private-key: ${{ secrets.VM_SSH_KEY }}

          - name: Add VM to known hosts
            run: ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

          - name: Copy manifests
            run: |
              scp -r registry-manifests ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/

          - name: Deploy on VM
            run: |
              ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
              "kubectl apply -f /home/${{ secrets.VM_USER }}/registry-manifests"
